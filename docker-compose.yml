# PurrOS — production-style Compose file.
# Create config/ first with `purros init` (or copy the examples in config/).
# See docs/getting-started/installation.md.
services:
  api:
    build:
      context: ./api
      args:
        VERSION: ${PURROS_VERSION:-dev}
    env_file: config/purros.env
    environment:
      PURROS_LISTEN: ":8080"
    volumes:
      - state:/var/lib/purros   # uploaded files and backups (PURROS_STATE_DIR)
    ports:
      - "127.0.0.1:8080:8080"   # put a reverse proxy with TLS in front
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: config/postgres.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional: share API rate limits across several api containers.
  # Start with `docker compose --profile redis up -d` and set REDIS_URL=redis://redis:6379 in config/purros.env.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped

volumes:
  db-data:
  state:
